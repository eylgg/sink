# Builds Sink.zip and attaches it to a GitHub release whenever a tag such as
# v0.0.1 is pushed. The release is titled after the version: "Sink 0.0.1".
# The GitHub release needs no setup; the workflow's own token is allowed to
# create releases by the permissions block below. The CurseForge and Wago
# uploads at the end need project IDs in the TOC and API tokens as secrets.
#
#   git tag v0.0.1 && git push origin v0.0.1
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@v7
        with:
          # The packager builds its changelog from the history since the last tag.
          fetch-depth: 0

      - name: Check that the TOC version matches the tag
        id: version
        run: |
          toc=$(sed -n 's/^## Version: *//p' Sink_Camelot.toc | tr -d '\r')
          tag="${GITHUB_REF_NAME#v}"
          if [ "$toc" != "$tag" ]; then
            echo "Sink_Camelot.toc says version $toc but the tag is $GITHUB_REF_NAME." >&2
            echo "Update '## Version:' in the TOC, commit, and move the tag." >&2
            exit 1
          fi
          # Version without the leading v, for the release title.
          echo "number=$tag" >> "$GITHUB_OUTPUT"

      - name: Build Sink.zip from the files the TOC lists
        run: bash scripts/package.sh

      - name: Create the release and attach Sink.zip
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/release/Sink.zip \
            --verify-tag \
            --title "Sink ${{ steps.version.outputs.number }}" \
            --generate-notes

      # Uploads to CurseForge and Wago using the project IDs in the TOC
      # (## X-Curse-Project-ID, ## X-Wago-ID) and the CF_API_KEY and
      # WAGO_API_TOKEN repository secrets. A site whose ID or secret is missing
      # is skipped. GITHUB_OAUTH is left unset so the packager does not make a
      # second GitHub release.
      - name: Upload to CurseForge and Wago
        uses: BigWigsMods/packager@v2
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
